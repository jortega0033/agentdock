name: CI

# The everyday quality gate: code quality plus deterministic verification of committed brand assets.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json's "engines" field declares 20.x-22.x as the actually-tested range (issue
        # #64) — exercise both edges, not just the minimum.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` pinned here on purpose — this reads the pnpm version straight from the
      # repo's own `packageManager` field (package.json), so the workflow can't silently drift
      # from what `pnpm install` locally actually uses.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install asset tooling
        run: python -m pip install -r scripts/assets/requirements.txt

      - name: Verify icon assets are reproducible
        run: python scripts/assets/verify_generated_assets.py

      - name: Validate assets
        run: |
          python scripts/assets/test_svg_safety.py
          python scripts/assets/validate_assets.py

      - name: Docs claim check
        run: pnpm docs:claim-check

      # Production dependencies only (issue #61): a vulnerable devDependency (e.g. the documented
      # electron-builder dev-tool-chain exception, docs/packaging.md#current-dependency-audit-exception)
      # never blocks this gate, but anything reachable from an actually-shipped runtime path does.
      - name: Production dependency audit
        run: pnpm audit --prod

      - name: Provider conformance
        run: pnpm test:provider-conformance

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # This repository's branch ruleset names its required status check literally "Lint, typecheck,
  # test, build" (no per-matrix-leg suffix). GitHub Actions appends the matrix combination to a
  # job's check name automatically once a job has `strategy.matrix`, so build-and-test's own check
  # never matches that literal string again -- discovered the hard way: a PR with a green matrix
  # still couldn't merge ("2 of 2 required status checks are expected"), because the required
  # check name no longer existed. This gate job carries the exact required name and only succeeds
  # once every matrix leg has, so "all Node versions passed" is still what actually gates merge.
  build-and-test-gate:
    name: Lint, typecheck, test, build
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Node version to have passed
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "::error::build-and-test matrix did not fully succeed (result: ${{ needs.build-and-test.result }})"
            exit 1
          fi
