name: Secret scan

# Issue #61: CI-based secret scanning, independent of whatever GitHub's own repository-level
# secret scanning setting is configured to (that's a Settings-page toggle, not something a
# workflow file can turn on for you — this is a belt-and-suspenders CI gate that runs regardless).
# Runs the real gitleaks CLI (MIT-licensed, github.com/gitleaks/gitleaks) directly rather than the
# separately-licensed "Gitleaks" GitHub Action wrapper, so this workflow has no dependency on any
# commercial license or secret. `--redact` keeps a real match's *value* out of workflow logs even
# if one is found — only its file/line and rule name are printed.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify gitleaks
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$archive" "$base/$archive"
          curl -sSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          chmod +x gitleaks

      - name: Scan working tree for secrets
        run: ./gitleaks detect --source . --no-git --redact -v
