name: Windows Test Suite

# Proves the full test suite (not just the packaging-smoke subset in package-windows.yml) is
# actually green on Windows — Core CI's build-and-test job only runs on ubuntu-latest, so this was
# previously unverified in CI at all (issue #60).
#
# `stress-flaky-files` separately hammers the two files that were observed exceeding their timeout
# under Windows' real parallel-worker CPU/IO contention (apps/daemon/test/subagent-worktree.test.ts,
# apps/desktop/test/App.test.tsx), repeating them well past the "10 consecutive runs" bar cheaply,
# without repeating the entire suite on every push.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: Full suite (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # package.json declares "engines": { "node": ">=22 <23" } (issue #127) — 22 is both the
        # minimum and only supported major today.
        node-version: [22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  stress-flaky-files:
    name: Repetition stress (previously timing-sensitive files)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repeat apps/daemon/test/subagent-worktree.test.ts 10x
        shell: pwsh
        run: |
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "=== subagent-worktree.test.ts run $i/10 ==="
            pnpm --filter @agent-dock/daemon exec vitest run test/subagent-worktree.test.ts
            if ($LASTEXITCODE -ne 0) {
              Write-Error "subagent-worktree.test.ts failed on run $i/10"
              exit 1
            }
          }

      - name: Repeat apps/desktop/test/App.test.tsx 10x
        shell: pwsh
        run: |
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "=== App.test.tsx run $i/10 ==="
            pnpm --filter @agent-dock/desktop exec vitest run test/App.test.tsx
            if ($LASTEXITCODE -ne 0) {
              Write-Error "App.test.tsx failed on run $i/10"
              exit 1
            }
          }
