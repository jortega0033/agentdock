<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">AgentDock local runtime flow</title>
  <desc id="desc">A React renderer sends typed IPC to Electron main, which uses the AgentDock client to reach a loopback daemon. Provider adapters run installed Claude Code or Codex CLIs.</desc>
  <rect width="1400" height="440" rx="32" fill="#0B1020"/>
  <g opacity=".26" stroke="#273449">
    <path d="M0 88h1400M0 176h1400M0 264h1400M0 352h1400"/>
    <path d="M140 0v440M280 0v440M420 0v440M560 0v440M700 0v440M840 0v440M980 0v440M1120 0v440M1260 0v440"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="60" y="66" fill="#F8FAFC" font-size="28" font-weight="700">One local runtime. Multiple agent CLIs.</text>
    <text x="60" y="98" fill="#94A3B8" font-size="17">Credentials stay with each installed CLI; normalized events travel back through typed boundaries.</text>

    <g transform="translate(60 150)">
      <rect width="210" height="150" rx="18" fill="#121A2B" stroke="#334155" stroke-width="2"/>
      <text x="24" y="42" fill="#8B9BFF" font-size="14" font-weight="700" letter-spacing="1.5">UNTRUSTED UI</text>
      <text x="24" y="78" fill="#F8FAFC" font-size="24" font-weight="700">React renderer</text>
      <text x="24" y="108" fill="#94A3B8" font-size="16">Prompts + events</text>
      <text x="24" y="132" fill="#94A3B8" font-size="16">No daemon token</text>
    </g>
    <g transform="translate(322 150)">
      <rect width="250" height="150" rx="18" fill="#18213A" stroke="#5B6CFF" stroke-width="2"/>
      <text x="24" y="42" fill="#8B9BFF" font-size="14" font-weight="700" letter-spacing="1.5">TRUSTED PROCESS</text>
      <text x="24" y="78" fill="#F8FAFC" font-size="24" font-weight="700">Electron main</text>
      <text x="24" y="108" fill="#CBD5E1" font-size="16">Fixed IPC bridge</text>
      <text x="24" y="132" fill="#CBD5E1" font-size="16">@agent-dock/client</text>
    </g>
    <g transform="translate(624 150)">
      <rect width="230" height="150" rx="18" fill="#102B30" stroke="#2DD4BF" stroke-width="2"/>
      <text x="24" y="42" fill="#5EEAD4" font-size="14" font-weight="700" letter-spacing="1.5">LOOPBACK ONLY</text>
      <text x="24" y="78" fill="#F8FAFC" font-size="24" font-weight="700">Local daemon</text>
      <text x="24" y="108" fill="#CBD5E1" font-size="16">Fastify + bearer auth</text>
      <text x="24" y="132" fill="#CBD5E1" font-size="16">Protocol v1 + SSE</text>
    </g>
    <g transform="translate(906 150)">
      <rect width="190" height="150" rx="18" fill="#121A2B" stroke="#334155" stroke-width="2"/>
      <text x="24" y="42" fill="#FBBF24" font-size="14" font-weight="700" letter-spacing="1.5">ADAPTERS</text>
      <text x="24" y="78" fill="#F8FAFC" font-size="23" font-weight="700">Provider layer</text>
      <text x="24" y="108" fill="#94A3B8" font-size="16">Spawn + parse</text>
      <text x="24" y="132" fill="#94A3B8" font-size="16">Normalize events</text>
    </g>
    <g transform="translate(1148 150)">
      <rect width="192" height="150" rx="18" fill="#121A2B" stroke="#334155" stroke-width="2"/>
      <text x="24" y="42" fill="#FBBF24" font-size="14" font-weight="700" letter-spacing="1.5">USER CLIS</text>
      <text x="24" y="78" fill="#F8FAFC" font-size="22" font-weight="700">Claude Code</text>
      <text x="24" y="110" fill="#F8FAFC" font-size="22" font-weight="700">Codex</text>
      <text x="24" y="134" fill="#94A3B8" font-size="15">Own login state</text>
    </g>

    <g fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M270 225h38"/><path d="m300 218 8 7-8 7"/>
      <path d="M572 225h38"/><path d="m602 218 8 7-8 7"/>
      <path d="M854 225h38"/><path d="m884 218 8 7-8 7"/>
      <path d="M1096 225h38"/><path d="m1126 218 8 7-8 7"/>
    </g>

    <g transform="translate(60 340)">
      <rect width="1280" height="54" rx="14" fill="#0F172A" stroke="#273449"/>
      <circle cx="28" cy="27" r="6" fill="#2DD4BF"/>
      <text x="48" y="33" fill="#CBD5E1" font-size="16">Local-only execution</text>
      <circle cx="270" cy="27" r="6" fill="#5B6CFF"/>
      <text x="290" y="33" fill="#CBD5E1" font-size="16">Typed client contract</text>
      <circle cx="542" cy="27" r="6" fill="#F59E0B"/>
      <text x="562" y="33" fill="#CBD5E1" font-size="16">Provider-neutral events</text>
      <circle cx="850" cy="27" r="6" fill="#22C55E"/>
      <text x="870" y="33" fill="#CBD5E1" font-size="16">CLI-managed authentication</text>
    </g>
  </g>
</svg>
