name: Question
description: Ask for help after checking the documentation and existing issues.
title: '[Question]: '
labels:
  - question
  - triage
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I checked the README, DEVELOPMENT.md, and existing issues.
          required: true
        - label: This question contains no credentials, tokens, or private security details.
          required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Relevant environment details
