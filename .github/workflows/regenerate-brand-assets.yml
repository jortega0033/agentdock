name: Regenerate brand assets

on:
  push:
    branches:
      - fix/rebuild-brand-assets-from-vector

permissions:
  contents: write

concurrency:
  group: regenerate-brand-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install asset tooling
        run: python -m pip install -r scripts/assets/requirements.txt

      - name: Regenerate desktop icon binaries
        run: python scripts/assets/generate_assets.py

      - name: Validate generated assets
        run: python scripts/assets/validate_assets.py

      - name: Commit regenerated binaries
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/assets/app-icons; then
            echo "Generated icon assets already match the vector source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/assets/app-icons
          git commit -m "fix(brand): regenerate desktop icons from vector source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
