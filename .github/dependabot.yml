version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
    reviewers:
      - jortega0033
    commit-message:
      prefix: deps
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
    reviewers:
      - jortega0033
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
